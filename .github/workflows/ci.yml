name: CI — Test & Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check src/ api/ scripts/ tests/ --ignore E501,E402

  # ─── Unit & Integration Tests ─────────────────────────────────────────────
  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint

    # Minimal service containers for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asha
          POSTGRES_PASSWORD: asha
          POSTGRES_DB: asha_hospital
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          APP_ENV=dev
          DEBUG=true
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=asha
          DB_PASSWORD=asha
          DB_NAME=asha_hospital
          REDIS_HOST=localhost
          REDIS_PORT=6379
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          QDRANT_HOST=localhost
          QDRANT_PORT=6333
          DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}
          EOF

      - name: Run database migrations
        run: alembic upgrade head
        continue-on-error: true   # Non-fatal if Qdrant is absent in CI

      - name: Run tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/test_integration.py \
            -x
        env:
          PYTHONPATH: .

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
