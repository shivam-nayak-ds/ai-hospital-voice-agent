# ─── ASHA AI Hospital Agent — Production Stack ───────────────────────────────
# Services: App (Gunicorn + Uvicorn) | PostgreSQL | Redis | Qdrant
# Run: docker compose up --build -d
# Logs: docker compose logs -f app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_hospital_agent_app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://asha:asha_dev_password@postgres:5432/asha_hospital
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: asha
      DB_PASSWORD: asha_dev_password
      DB_NAME: asha_hospital
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    # No volume mount in production — code is baked into the Docker image

  postgres:
    image: postgres:16-alpine
    container_name: ai_hospital_agent_postgres
    environment:
      POSTGRES_USER: asha
      POSTGRES_PASSWORD: asha_dev_password
      POSTGRES_DB: asha_hospital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asha -d asha_hospital"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c work_mem=16MB
      -c effective_cache_size=128MB

  redis:
    image: redis:7-alpine
    container_name: ai_hospital_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: ai_hospital_agent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
