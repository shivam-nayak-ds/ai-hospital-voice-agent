services:
  app:
    build: .
    container_name: ai_hospital_agent_app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://asha:asha_dev_password@postgres:5432/asha_hospital
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: asha
      DB_PASSWORD: asha_dev_password
      DB_NAME: asha_hospital
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai_hospital_agent_postgres
    environment:
      POSTGRES_USER: asha
      POSTGRES_PASSWORD: asha_dev_password
      POSTGRES_DB: asha_hospital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asha -d asha_hospital"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_hospital_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: ai_hospital_agent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
